<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics de Partidas</title>
<style>
  /* Fontes dentro do repositório: funcionam no site e no Discord (que bloqueia o Google Fonts). */
  @font-face{font-family:"Bebas Neue";font-weight:400;font-display:swap;src:url(fonts/bebas-neue-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Inter";font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:"Inter";font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:"Inter";font-weight:800;font-display:swap;src:url(fonts/inter-latin-800-normal.woff2) format("woff2")}
  :root{
    --bg:#0a0c12; --panel:#131722; --panel2:#181d2b; --line:#252c3f; --text:#e9ecf5; --muted:#8a93ab;
    --win:#3ddc97; --loss:#ff5c6c; --gold:#ffd166;
    --accent:#ff4655; --on-accent:#fff;
    --topbar:rgba(10,12,18,.82); --side:rgba(19,23,34,.96); --fade:24,29,43; --head:10,12,18; color-scheme:dark;
  }
  body[data-jogo="valorant"] {--accent:#ff4655; --on-accent:#fff}
  body[data-jogo="minecraft"]{--accent:#62c13f; --on-accent:#0a0c12}
  body[data-jogo="cs"]       {--accent:#f5a524; --on-accent:#0a0c12}
  body[data-jogo="xadrez"]   {--accent:#e8e8e8; --on-accent:#0a0c12}
  /* Modo claro */
  :root[data-tema="claro"]{
    --bg:#f3f4f8; --panel:#ffffff; --panel2:#eef0f5; --line:#d9dde7; --text:#151925; --muted:#5d667c;
    --win:#0f9a60; --loss:#e0384c; --gold:#a87700;
    --topbar:rgba(243,244,248,.88); --side:rgba(255,255,255,.97); --fade:238,240,245; --head:255,255,255; color-scheme:light;
  }
  :root[data-tema="claro"] body[data-jogo="minecraft"]{--accent:#3f9b27; --on-accent:#fff}
  :root[data-tema="claro"] body[data-jogo="cs"]{--accent:#d98608; --on-accent:#fff}
  :root[data-tema="claro"] body[data-jogo="xadrez"]{--accent:#2b303c; --on-accent:#fff}
  :root[data-tema="claro"] .side{box-shadow:0 20px 50px -25px rgba(20,25,40,.35)}
  :root[data-tema="claro"] .pdlg::backdrop{background:rgba(30,35,50,.45)}

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Inter,system-ui,sans-serif;color:var(--text);min-height:100vh;
    background:radial-gradient(1000px 520px at 15% -10%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 65%), var(--bg);
    transition:background .4s;
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  img{display:block}

  /* ---------- topo ---------- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;gap:16px;align-items:center;flex-wrap:wrap;
    padding:14px 24px;background:var(--topbar);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .brand{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:28px;letter-spacing:1.5px;white-space:nowrap}
  .brand i{font-style:normal;color:var(--accent)}
  .search{flex:1;min-width:200px;max-width:420px;position:relative}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px 10px 40px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .jogos{display:flex;gap:6px;flex-wrap:wrap}
  .jogos button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:600;font-size:14px;transition:.2s}
  .jogos button:hover{border-color:var(--accent)}
  .jogos button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:800;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent),0 6px 18px -6px var(--accent)}
  .jogos .jogo-add{width:38px;padding:8px 0;font-size:16px;font-weight:800;color:var(--muted)}
  .dlg-t{font-size:18px;margin-bottom:12px}
  .jogos-lista{display:flex;flex-direction:column;gap:8px}
  .jogo-item{display:grid;grid-template-columns:52px 1fr 48px auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--panel2)}
  .inp.ico{text-align:center;font-size:20px;padding:8px}
  input[type=color]{width:46px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:3px;cursor:pointer}
  .jogo-item .btn{padding:8px 12px;font-size:13px}
  .jogo-novo{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .jogo-novo h3{font-size:15px}
  .jogo-novo-row{display:grid;grid-template-columns:52px 1fr 48px;gap:10px;align-items:center}
  .tema{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:18px;margin-left:auto}
  .tema:hover{border-color:var(--accent)}

  .banner{margin:16px 24px 0;padding:10px 16px;border-radius:12px;background:color-mix(in srgb,var(--gold) 14%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);color:var(--gold);font-size:13px}
  main{padding:24px;margin-right:420px;max-width:1200px}

  h2{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:8px 0 16px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}

  /* ---------- bolinhas ---------- */
  .bubbles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin-bottom:30px}
  .bubble{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border-radius:18px;position:relative;transition:background .2s, transform .2s}
  .bubble:hover{background:var(--panel);transform:translateY(-3px)}
  .bubble:hover .ava{box-shadow:0 0 0 3px var(--accent),0 10px 30px -8px var(--accent)}
  .bn{font-weight:700;font-size:15px;text-align:center;word-break:break-word}
  .bs{font-size:12px;color:var(--muted)}
  .bs b{color:var(--win)} .bs em{font-style:normal;color:var(--loss)}
  .star{position:absolute;top:10px;right:16px;color:var(--gold);font-size:16px}
  .empty{color:var(--muted);padding:20px 0}

  .ava{width:var(--s,84px);height:var(--s,84px);border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;
    font-weight:800;font-size:calc(var(--s,84px)*.36);color:#fff;
    background:linear-gradient(135deg,hsl(var(--h) 70% 55%),hsl(calc(var(--h) + 50) 70% 35%));
    box-shadow:0 0 0 2px var(--line);transition:box-shadow .25s}
  .ava img{width:100%;height:100%;object-fit:cover}

  /* ---------- perfil ---------- */
  .back{color:var(--muted);font-weight:600;margin-bottom:16px}
  .back:hover{color:var(--text)}
  .phead{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .avawrap{position:relative;flex:none}
  .avabtn{border-radius:50%;display:block;cursor:zoom-in}
  .avabtn:hover .ava{filter:brightness(.85)}
  .avabtn:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .avawrap .cam{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .pdlg{margin:auto;border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--text);padding:28px 24px 24px;width:min(480px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;position:relative}
  .pdlg::backdrop{background:rgba(5,6,10,.75);backdrop-filter:blur(6px)}
  .pdlg .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:16px}
  .pdlg .x:hover{background:var(--panel2);color:var(--text)}
  .pdlg-foto{display:flex;justify-content:center}
  .pdlg-foto .ava{--s:min(260px,60vw) !important;box-shadow:0 0 0 3px var(--accent),0 20px 60px -15px var(--accent)}
  .pdlg-nome{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:44px;text-align:center;margin-top:14px;line-height:1}
  .pdlg-form{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .pdlg-form h3{font-size:15px}
  .phead .ava{--s:120px;box-shadow:0 0 0 3px var(--accent),0 14px 40px -10px var(--accent)}
  .pname{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:56px;letter-spacing:1px;line-height:1}
  .tags{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
  .tag.me{color:var(--accent);border-color:var(--accent)}
  .favbtn{margin-left:auto;padding:10px 16px;border-radius:12px;border:1px solid var(--line);font-weight:700}
  .favbtn.on{color:var(--gold);border-color:var(--gold)}

  .elo{display:inline-flex;align-items:center;gap:6px}
  .elo img{width:var(--es,22px);height:var(--es,22px);object-fit:contain}
  .elo .eb{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--ec,#555);color:#fff}

  .reg{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-bottom:16px}
  .reg h3,.edit h3{grid-column:1 / -1;font-size:15px}
  .reg small{grid-column:1 / -1;color:var(--muted);font-size:12px}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
  .inp{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;width:100%}
  .inp:focus{border-color:var(--accent)}
  .inp.win{border-color:color-mix(in srgb,var(--win) 50%,var(--line));font-size:22px;font-weight:800;color:var(--win)}
  .inp.loss{border-color:color-mix(in srgb,var(--loss) 50%,var(--line));font-size:22px;font-weight:800;color:var(--loss)}
  .btn{background:var(--accent);color:var(--on-accent);font-weight:800;padding:12px 20px;border-radius:12px;transition:filter .2s, transform .1s}
  .btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  details.edit{margin-bottom:16px}
  details.edit summary{cursor:pointer;font-weight:700;color:var(--muted)}
  details.edit[open] summary{margin-bottom:14px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kpi .v{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:48px;line-height:1;margin-top:6px}
  .kpi .l{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .kpi.w .v{color:var(--win)} .kpi.lo .v{color:var(--loss)} .kpi.p .v{color:var(--accent)}

  .periods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .period{display:flex;gap:16px;align-items:center}
  .donut{width:104px;height:104px;flex:none;position:relative}
  .donut svg{transform:rotate(-90deg)}
  .donut circle{fill:none;stroke-width:12;transition:stroke-dasharray .6s}
  .donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:28px;line-height:1}
  .donut .c small{display:block;font-family:Inter;font-size:9px;letter-spacing:1.5px;color:var(--muted)}
  .period h4{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .lg{font-size:13px;display:flex;flex-direction:column;gap:4px}
  .lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}

  .chart svg{width:100%;display:block}
  .tables{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .scroll{max-height:320px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:0 6px 8px;position:sticky;top:0;background:var(--panel)}
  td{padding:8px 6px;border-top:1px solid var(--line)}
  th:not(:first-child),td:not(:first-child){text-align:right}
  td.w{color:var(--win);font-weight:700} td.lo{color:var(--loss);font-weight:700}
  .pbar{height:4px;border-radius:9px;background:var(--loss);overflow:hidden;margin-top:4px;min-width:50px}
  .pbar div{height:100%;background:var(--win)}

  /* ---------- barra lateral ---------- */
  .side{position:fixed;top:84px;right:16px;width:390px;z-index:30;background:var(--side);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px -20px #000;display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
  .side-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
  .side-head:active{cursor:grabbing}
  .side-head span{font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .side-head button{width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:18px;line-height:1}
  .side-head button:hover{background:var(--panel2);color:var(--text)}
  .side.min .side-body{display:none}
  .side-body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:22px}
  .side h3{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600}
  .side h3 b{color:var(--accent)}
  .quem form{display:grid;grid-template-columns:1fr 84px auto;gap:8px}
  .quem .inp{padding:10px 12px}
  .quem .btn{padding:10px 14px}
  .who{display:flex;gap:12px;align-items:center}
  .who .ava{--s:48px}
  .who div{flex:1} .who b{display:block;font-size:16px}
  .who .links{display:flex;gap:10px;font-size:13px}
  .who .links button{color:var(--accent);font-weight:600} .who .links button.out{color:var(--muted)}

  .rank td,.rank th{padding:7px 4px;font-size:12px}
  .rank tr.r{cursor:pointer} .rank tr.r:hover td{background:var(--panel2)}
  .rank .pos{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:18px;color:var(--muted);width:22px}
  .rank tr:nth-child(2) .pos{color:var(--gold)}
  .rank .nm{display:flex;gap:8px;align-items:center;font-weight:700;max-width:110px}
  .rank .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .ava{--s:24px;font-size:10px}

  .add{display:flex;flex-direction:column;gap:10px}
  .fotopick{display:flex;gap:12px;align-items:center;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
  .fotopick .ava{--s:56px;--h:220;border:2px dashed var(--line);box-shadow:none;background:var(--bg);color:var(--muted);font-size:22px}
  .row2{display:grid;grid-template-columns:1fr 100px;gap:8px}
  .elopick summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
  .elogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
  .elogrid label{border:1px solid var(--line);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:9px;color:var(--muted);text-align:center}
  .elogrid label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text)}
  .elogrid input{display:none}
  .elogrid .elo{--es:30px;flex-direction:column}

  .ghform{display:grid;grid-template-columns:1fr auto;gap:8px}
  .ghform .inp{padding:10px 12px} .ghform .btn{padding:10px 14px}
  .ghhelp{font-size:12px;color:var(--muted);margin-top:8px}
  .ghok{font-size:13px;color:var(--win);line-height:1.6}
  .ghok code{color:var(--text)} .ghok button{color:var(--muted);text-decoration:underline;margin-left:4px}
  .btn:disabled{opacity:.6;cursor:wait}
  .abas{display:flex;width:fit-content;gap:4px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:16px}
  .abas button{padding:9px 18px;border-radius:10px;font-weight:700;color:var(--text);opacity:.75}
  .abas button:hover{opacity:1}
  .abas button.on{background:var(--accent);color:var(--on-accent);opacity:1;box-shadow:0 6px 18px -6px var(--accent)}
  .trk-conta h3{font-size:15px;margin-bottom:12px}
  .trk-conta-row{display:grid;grid-template-columns:1fr 170px auto;gap:10px}
  .trk-conta small{display:block;color:var(--muted);font-size:12px;margin-top:8px}
  .trk-load,.trk-erro{color:var(--muted)} .trk-erro b{color:var(--loss)}
  .trk-trocar{margin-top:16px} .trk-trocar summary{cursor:pointer;color:var(--muted);font-weight:600;margin-bottom:10px}
  .trk-head{display:flex;gap:18px;align-items:center;padding:22px;border-radius:18px;border:1px solid var(--line);background:var(--panel) center/cover;margin-bottom:12px}
  .trk-cardp{width:72px;height:72px;border-radius:14px;object-fit:cover;box-shadow:0 0 0 2px var(--accent)}
  .trk-riot{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:42px;line-height:1}
  .trk-riot span{color:var(--muted);font-size:.6em;margin-left:4px}
  .trk-head button.tag{cursor:pointer} .trk-head button.tag:hover{color:var(--text)}
  .trk-ranks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .trk-rank{display:flex;gap:16px;align-items:center}
  .trk-rank .l{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .trk-rank-n{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:34px;line-height:1.1}
  .trk-rank small{color:var(--muted);font-size:12px}
  .trk-rr{height:6px;width:160px;max-width:100%;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 4px}
  .trk-rr div{height:100%;background:var(--accent)}
  .trk-kpis small{color:var(--muted);font-size:12px}
  .trk-nota{color:var(--muted);font-size:12px;margin:-6px 0 12px}
  .scroll-x{overflow-x:auto}
  .aq-relogio{text-align:center;padding:30px 20px;margin-bottom:16px}
  .aq-relogio.rodando{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 18px 50px -20px var(--accent)}
  .aq-status{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .aq-relogio.rodando .aq-status{color:var(--accent)}
  .aq-tempo{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:clamp(64px,14vw,120px);line-height:1.05;letter-spacing:3px;margin:10px 0 18px;font-variant-numeric:tabular-nums}
  .aq-relogio.rodando .aq-tempo{color:var(--accent);animation:aqpulso 2s ease-in-out infinite}
  @keyframes aqpulso{50%{opacity:.8}}
  @media (prefers-reduced-motion:reduce){.aq-relogio.rodando .aq-tempo{animation:none}}
  .aq-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .aq-btns .btn{padding:14px 26px;font-size:16px}
  .aq-nota{color:var(--muted);font-size:13px}
  .kpi small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
  .trk-conta-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:15px}
  .trk-conta-top span{color:var(--muted);font-size:13px}
  .trk-conta-top .btn{padding:7px 14px;font-size:13px;margin-left:auto}
  .trk-agf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .trk-agf button{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:600;font-size:13px}
  .trk-agf button:first-child{padding-left:12px}

   perfis -> "Nome" (chave principal) -> foto, pin, elo, favoritos,
             partidas -> jogo -> "AAAA-MM-DD" -> { ganhou, perdeu }

const JOGOS = { valorant:"Valorant", minecraft:"Minecraft", cs:"CS", xadrez:"Xadrez" };
const ICONE = { valorant:"🎯", minecraft:"⛏️", cs:"💣", xadrez:"♟️" };
const CORES = {};

const HEX_RE = /^#[0-9a-f]{6}$/i;

}

function aplicarCorJogo(){

  if (!cor) { st.removeProperty("--accent"); st.removeProperty("--on-accent"); return; }
  const [r, g, b] = [1, 3, 5].map(i => parseInt(cor.slice(i, i + 2), 16) / 255);

}
const ELOS = [""].concat(...["Ferro","Bronze","Prata","Ouro","Platina","Diamante","Ascendente","Imortal"].map(n => [1,2,3].map(i => `${n} ${i}`)), ["Radiante"]);
const ELO_COR = { Ferro:"#5b5b5b", Bronze:"#a0703c", Prata:"#9aa4ab", Ouro:"#d9a531", Platina:"#2c9ca8", Diamante:"#b06fe0", Ascendente:"#2fae6c", Imortal:"#c23a5a", Radiante:"#e9c46a" };
// Dentro do Discord, sites externos passam pelo proxy (URL Mappings do Developer Portal).

/* Imagens oficiais (elos, agentes, mapas) vindas da valorant-api.com. */

const ELO_IMG = t => ASSETS.tiers[t] || `${EXT("elos", "media.valorant-api.com")}/competitivetiers/03621f52-342b-cf4e-4f86-9350a49c6d04/${t}/largeicon.png`;

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const hojeISO = () => iso(new Date());
const deISO = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };

const somarDias = (k, n) => { const d = deISO(k); d.setDate(d.getDate() + n); return iso(d); };
const somarMeses = (m, n) => { const [y, mm] = m.split("-").map(Number); return iso(new Date(y, mm - 1 + n, 1)).slice(0, 7); };
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESES_LONGO = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS_SEM = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const fmtDia = k => { const [y,m,d] = k.split("-"); return `${d}/${m}/${y}`; };
const fmtMes = k => { const [y,m] = k.split("-"); return `${MESES[+m-1]}/${y}`; };
const fmtMesLongo = k => { const [y,m] = k.split("-"); return `${MESES_LONGO[+m-1]} ${y}`; };
const fmtDiaLongo = k => { const d = deISO(k); return `${DIAS_SEM[d.getDay()]}, ${d.getDate()} de ${MESES_LONGO[d.getMonth()]}`; };

/* Valorant com conta vinculada: o contador vem só das ranqueadas puxadas do tracker. */
const contaVal = p => TRACKER_ON && p?.valorant?.conta;
const dias = (nome, j = jogo) => {
  const p = db.perfis[nome];
  if (j === "valorant" && contaVal(p)) {
    const d = {};
    for (const m of Object.values(p.valorant.partidas || {})) {
      const x = d[m.dia] ||= { ganhou: 0, perdeu: 0, empate: 0 };
      m.resultado === "V" ? x.ganhou++ : m.resultado === "D" ? x.perdeu++ : x.empate++;
    }
    return d;
  }
  return p?.partidas?.[j] || {};
};
function soma(d, filtro = () => true){
  let g = 0, p = 0, e = 0;
  for (const [k, v] of Object.entries(d)) if (filtro(k)) { g += +v.ganhou || 0; p += +v.perdeu || 0; e += +v.empate || 0; }
  const t = g + p + e;
  return { g, p, e, t, pct: t ? Math.round(g / t * 100) : 0 };
}

function donut(s){
  const r = 44, C = 2 * Math.PI * r, lg = s.t ? s.g / s.t * C : 0, lp = s.t ? s.p / s.t * C : 0;
  return `<div class="donut"><svg width="104" height="104" viewBox="0 0 104 104">
    <circle cx="52" cy="52" r="${r}" stroke="var(--line)"/>
    <circle cx="52" cy="52" r="${r}" stroke="var(--win)" stroke-dasharray="${lg} ${C}"/>
    <circle cx="52" cy="52" r="${r}" stroke="var(--loss)" stroke-dasharray="${lp} ${C}" stroke-dashoffset="${-lg}"/>
  </svg><div class="c"><div>${s.t ? s.pct + "%" : "—"}<small>VITÓRIA</small></div></div></div>`;
}
function grafico30(d){
  const W = 720, H = 220, P = { l: 28, r: 8, t: 14, b: 26 }, N = 30, mid = (H - P.b + P.t) / 2;
  const ks = [...Array(N)].map((_, i) => { const x = new Date(); x.setDate(x.getDate() - (N - 1 - i)); return iso(x); });
  const max = Math.max(1, ...ks.map(k => Math.max(+d[k]?.ganhou || 0, +d[k]?.perdeu || 0)));
  const bw = (W - P.l - P.r) / N, hh = mid - P.t;
  let s = `<line x1="${P.l}" x2="${W - P.r}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>
    <text x="${P.l - 6}" y="${P.t + 8}" fill="var(--muted)" font-size="10" text-anchor="end">${max}</text>
    <text x="${P.l - 6}" y="${mid * 2 - P.t}" fill="var(--muted)" font-size="10" text-anchor="end">${max}</text>`;
  ks.forEach((k, i) => {
    const g = +d[k]?.ganhou || 0, p = +d[k]?.perdeu || 0, x = P.l + i * bw + 2, w = bw - 4;
    const hg = g / max * hh, hp = p / max * hh;
    if (g) s += `<rect x="${x}" y="${mid - hg}" width="${w}" height="${hg}" rx="3" fill="var(--win)"><title>${fmtDia(k)}: ganhou ${g}</title></rect>`;
    if (p) s += `<rect x="${x}" y="${mid}" width="${w}" height="${hp}" rx="3" fill="var(--loss)"><title>${fmtDia(k)}: perdeu ${p}</title></rect>`;
    if (i % 5 === 4 || i === N - 1) s += `<text x="${x + w / 2}" y="${H - 6}" fill="var(--muted)" font-size="10" text-anchor="middle">${k.slice(8)}/${k.slice(5, 7)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" font-family="Inter">${s}</svg>`;
}
const pbar = s => `<div class="pbar" style="${s.t ? "" : "background:var(--line)"}"><div style="width:${s.pct}%"></div></div>`;

/* ---------------------------------------------------------- Tracker do Valorant (HenrikDev API) */
const henrikUrl = path => `${EXT("henrik", "api.henrikdev.xyz")}/valorant/${path}`;
const mediaUrl = u => typeof u === "string" ? u.replace(/^https:\/\/media\.valorant-api\.com/, EXT("elos", "media.valorant-api.com")) : "";
const tierParaElo = t => t >= 3 && t <= 27 ? ELOS[t - 2] : "";
const CONTA_RE = /^[^#]{3,16}#[A-Za-z0-9]{2,5}$/;
const REGIOES = { br: "Brasil", latam: "LATAM", na: "América do Norte", eu: "Europa", ap: "Ásia/Pacífico", kr: "Coreia" };
const trackerCache = {}; // "conta|regiao" -> { status, dados, erro, t }

async function henrik(path){
  const r = await fetch(henrikUrl(path), { headers: { Authorization: HENRIK_KEY } });
  if (r.ok) return (await r.json()).data;
  throw new Error(
    r.status === 404 ? "Conta não encontrada. Confira o Nome#TAG e a região." :
    r.status === 401 || r.status === 403 ? "A chave da API do Valorant é inválida." :
    r.status === 429 ? "Muitas consultas seguidas. Tente de novo em 1 minuto." :
    `A API do Valorant não respondeu (erro ${r.status}).`);
}

function resumirPartidas(partidas, puuid, nome, tag){
  const lista = [];
  for (const m of partidas || []) {
    const eu = (m.players?.all_players || []).find(x => x.puuid === puuid || (`${x.name}#${x.tag}`.toLowerCase() === `${nome}#${tag}`.toLowerCase()));
    if (!eu) continue;
    const time = String(eu.team || "").toLowerCase(), t = m.teams?.[time] || {};
    const empate = !m.teams?.red?.has_won && !m.teams?.blue?.has_won;
    const s = eu.stats || {}, tiros = (s.headshots || 0) + (s.bodyshots || 0) + (s.legshots || 0);
    const rounds = m.metadata?.rounds_played || ((t.rounds_won || 0) + (t.rounds_lost || 0)) || 1;
    lista.push({
      resultado: empate ? "E" : t.has_won ? "V" : "D",
      placar: `${t.rounds_won ?? "?"}-${t.rounds_lost ?? "?"}`,
      mapa: m.metadata?.map || "?", agente: eu.character || "?", icone: mediaUrl(eu.assets?.agent?.small),
      k: s.kills || 0, d: s.deaths || 0, a: s.assists || 0, hs: tiros ? Math.round(s.headshots / tiros * 100) : 0,
      acs: Math.round((s.score || 0) / rounds), quando: (m.metadata?.game_start || 0) * 1000,
      _hs: s.headshots || 0, _tiros: tiros, _score: s.score || 0, _rounds: rounds,
    });
  }
  const n = lista.length, soma = k => lista.reduce((a, x) => a + x[k], 0);
  const v = lista.filter(x => x.resultado === "V").length;
  const agentes = {};
  for (const x of lista) { const a = (agentes[x.agente] ||= { nome: x.agente, icone: x.icone, jogos: 0, v: 0 }); a.jogos++; if (x.resultado === "V") a.v++; }
  return {
    lista, n, v, d: lista.filter(x => x.resultado === "D").length,
    wr: n ? Math.round(v / n * 100) : 0,
    kd: soma("d") ? (soma("k") / soma("d")).toFixed(2) : soma("k").toFixed(2),
    kda: soma("d") ? ((soma("k") + soma("a")) / soma("d")).toFixed(2) : "—",
    hs: soma("_tiros") ? Math.round(soma("_hs") / soma("_tiros") * 100) : 0,
    acs: soma("_rounds") ? Math.round(soma("_score") / soma("_rounds")) : 0,
    agentes: Object.values(agentes).sort((a, b) => b.jogos - a.jogos).slice(0, 3),
  };
}

async function carregarTracker(nomePerfil, forcar){
  const p = db.perfis[nomePerfil], cfg = p?.valorant;
  if (!cfg?.conta) return;
  const chave = `${cfg.conta}|${cfg.regiao}`, c = trackerCache[chave];
  if (!forcar && c && (c.status === "carregando" || Date.now() - c.t < 120000)) return;
  trackerCache[chave] = { status: "carregando", t: Date.now() };
  const [nome, tag] = cfg.conta.split("#"), q = `${encodeURIComponent(nome)}/${encodeURIComponent(tag)}`, reg = cfg.regiao || "br";
  try {
    const conta = await henrik(`v1/account/${q}`);
    const [mmr, partidas] = await Promise.all([
      henrik(`v2/mmr/${reg}/${q}`).catch(() => null),
      henrik(`v3/matches/${reg}/${q}?mode=competitive&size=10`).catch(() => []),
    ]);
    const cur = mmr?.current_data || {}, peak = mmr?.highest_rank || {};
    trackerCache[chave] = { status: "ok", t: Date.now(), dados: {
      nome: conta.name || nome, tag: conta.tag || tag, nivel: conta.account_level, card: mediaUrl(conta.card?.wide), cardP: mediaUrl(conta.card?.small),
      tier: cur.currenttier || 0, rr: cur.ranking_in_tier ?? null, ultimo: cur.mmr_change_to_last_game ?? null,
      pico: peak.tier || 0, picoTemp: peak.season || "",
      ...resumirPartidas(partidas, conta.puuid, conta.name || nome, conta.tag || tag),
    } };
    sincronizarElo(nomePerfil, cur.currenttier);
  } catch (e) {
    trackerCache[chave] = { status: "erro", erro: e.message, t: Date.now() };
  }
  if (view === nomePerfil && aba === "tracker") render();
}

/* O elo do perfil acompanha o rank da conta (só quem está logado no próprio perfil grava). */
/* O elo do perfil vem direto do tracker (qualquer um conectado grava; não precisa de PIN). */
async function sincronizarElo(nomePerfil, tier){
  const novo = tierParaElo(tier);
  if (!novo || !backend?.salva || !db.perfis[nomePerfil]?.valorant?.conta || db.perfis[nomePerfil].elo === novo) return;
  try { await acao({ op: "valorant_sync", nome: nomePerfil, partidas: [], elo: novo }); render(); toast(`${nomePerfil}: elo atualizado para ${novo}.`); } catch {}
}
async function eloDoTracker(cfg){
  const [n, t] = cfg.conta.split("#");
  const mmr = await henrik(`v2/mmr/${cfg.regiao || "br"}/${encodeURIComponent(n)}/${encodeURIComponent(t)}`).catch(() => null);
  return tierParaElo(mmr?.current_data?.currenttier || 0);
}

/* Período do tracker: dia | semana | mes | ano | tudo, a partir de uma data de referência. */
let trkPeriodo = "mes", trkRef = null, trkAgente = null; // trkAgente: filtro de agente (null = todos)
function periodoTracker(){
  const hoje = hojeISO(), ref = trkRef || hoje;
  if (trkPeriodo === "dia") return { filtro: d => d === ref, rotulo: ref === hoje ? "Hoje" : fmtDiaLongo(ref), ultimo: ref >= hoje };
  if (trkPeriodo === "semana") { const a = inicioSemana(ref), b = fimSemana(ref); return { filtro: d => d >= a && d <= b, rotulo: `${fmtDia(a).slice(0, 5)} a ${fmtDia(b).slice(0, 5)}`, ultimo: b >= hoje }; }
  if (trkPeriodo === "mes") { const m = ref.slice(0, 7); return { filtro: d => d.startsWith(m), rotulo: fmtMesLongo(m), ultimo: m >= hoje.slice(0, 7) }; }
  if (trkPeriodo === "ano") { const y = ref.slice(0, 4); return { filtro: d => d.startsWith(y), rotulo: y, ultimo: y >= hoje.slice(0, 4) }; }
  return { filtro: () => true, rotulo: "tudo", ultimo: true };
}
function moverPeriodo(n){
  const ref = trkRef || hojeISO();
  trkRef = trkPeriodo === "dia" ? somarDias(ref, n) : trkPeriodo === "semana" ? somarDias(ref, 7 * n)
    : trkPeriodo === "mes" ? somarMeses(ref.slice(0, 7), n) + "-01" : `${+ref.slice(0, 4) + n}-01-01`;
  if (trkRef > hojeISO()) trkRef = hojeISO();
}

function statsPartidas(lista){
  const n = lista.length, s = k => lista.reduce((a, m) => a + (+m[k] || 0), 0), med = k => n ? (s(k) / n).toFixed(1) : "0";
  const v = lista.filter(m => m.resultado === "V").length, dd = lista.filter(m => m.resultado === "D").length;
  return { n, v, dd, wr: n ? Math.round(v / n * 100) : 0, k: s("k"), d: s("d"), a: s("a"), km: med("k"), dm: med("d"), am: med("a"),
    kd: s("d") ? (s("k") / s("d")).toFixed(2) : s("k").toFixed(2), kda: s("d") ? ((s("k") + s("a")) / s("d")).toFixed(2) : "—",
    hs: n ? Math.round(s("hs") / n) : 0, acs: n ? Math.round(s("acs") / n) : 0 };
}

function renderTracker(nome, eu){
  const p = db.perfis[nome], cfg = p.valorant;
  if (!cfg?.conta) return eu && !leitura ? formContaValorant() : `<p class="empty">${esc(nome)} ainda não vinculou a conta do Valorant.</p>`;
  const c = trackerCache[`${cfg.conta}|${cfg.regiao}`];
  if (!c || c.status === "carregando") { carregarTracker(nome); return `<div class="card trk-load">Carregando o tracker de <b>${esc(cfg.conta)}</b>...</div>`; }
  const trocar = eu && !leitura ? `<details class="trk-trocar"><summary>Trocar conta</summary>${formContaValorant(cfg)}</details>` : "";
  if (c.status === "erro") return `<div class="card trk-erro"><b>Não consegui carregar ${esc(cfg.conta)}.</b><br>${esc(c.erro)}
    <div style="margin-top:12px"><button class="btn ghost" data-act="trk-recarregar" data-nome="${esc(nome)}">Tentar de novo</button></div></div>${trocar}`;
  const t = c.dados, eloAtual = tierParaElo(t.tier), eloPico = tierParaElo(t.pico);
  const quando = ms => ms ? new Date(ms).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) : "";
  // Base das estatísticas: as ranqueadas do mês salvas no JSON (mais completas); sem elas, as últimas da API.
  // Base: ranqueadas salvas no JSON, filtradas pelo período escolhido. Sem nenhuma salva, usa as últimas da API.
  const salvas = Object.values(p.valorant.partidas || {}).map(m => ({ ...m, icone: agenteIcone(m.agenteId, m.agente), mapaImg: mapaImg(m.mapa, m.mapaId) }));
  const usaSalvas = salvas.length > 0, per = periodoTracker();
  const base = usaSalvas ? salvas.filter(m => per.filtro(m.dia)).sort((a, b) => (b.dia + b.hora).localeCompare(a.dia + a.hora)) : t.lista;
  // Filtro de agente: tudo abaixo (contador, KDA, mapas, partidas) passa a ser só daquele agente.
  const agentesJogados = Object.values(base.reduce((acc, m) => { const a = acc[m.agente || "?"] ||= { nome: m.agente || "?", icone: m.icone, n: 0 }; a.n++; return acc; }, {})).sort((x, y) => y.n - x.n);
  if (trkAgente && !agentesJogados.some(a => a.nome === trkAgente)) trkAgente = null;
  const sel = trkAgente ? base.filter(m => (m.agente || "?") === trkAgente) : base;
  const fonte = (usaSalvas ? `${sel.length} ranqueadas · ${per.rotulo}` : `últimas ${sel.length} ranqueadas`) + (trkAgente ? ` · só ${trkAgente}` : "");
  const g = statsPartidas(sel);
  const porAgente = Object.values(base.reduce((acc, m) => { (acc[m.agente || "?"] ||= { nome: m.agente || "?", icone: m.icone, lista: [] }).lista.push(m); return acc; }, {}))

  const porMapa = Object.values(sel.reduce((acc, m) => { (acc[m.mapa || "?"] ||= { nome: m.mapa || "?", img: mapaImg(m.mapa, m.mapaId), lista: [] }).lista.push(m); return acc; }, {}))
    .map(a => ({ ...a, s: statsPartidas(a.lista) })).sort((x, y) => y.s.n - x.s.n || y.s.wr - x.s.wr);
  return `

    ${agentesJogados.length > 1 || trkAgente ? `<div class="trk-agf">

      ${agentesJogados.map(a => `<button data-act="trk-ag" data-ag="${esc(a.nome)}" class="${trkAgente === a.nome ? "on" : ""}" title="${a.n} partidas">${a.icone ? `<img src="${esc(a.icone)}" alt="" onerror="this.remove()">` : ""}${esc(a.nome)}<small>${a.n}</small></button>`).join("")}

    <div class="trk-cont">

      <div class="card lo"><span>Perdeu</span><b>${g.dd}</b></div>
      <div class="card p"><span>% Vitória</span><b>${g.n ? g.wr + "%" : "—"}</b></div>
    </div>

    <div class="kpis trk-kpis">
      <div class="card kpi p"><div class="l">ACS médio</div><div class="v">${g.acs}</div><small>${g.n} partidas</small></div>
      <div class="card kpi"><div class="l">K / D / A médio</div><div class="v">${g.km}/${g.dm}/${g.am}</div><small>Total ${g.k}/${g.d}/${g.a}</small></div>
      <div class="card kpi"><div class="l">K/D</div><div class="v">${g.kd}</div><small>KDA ${g.kda}</small></div>

    </div>
    <p class="trk-nota">Estatísticas de ${esc(fonte)}.</p>

    <div class="trk-head" style="${t.card ? `background-image:linear-gradient(90deg,rgba(var(--head),.92) 30%,rgba(var(--head),.35)),url('${esc(t.card)}')` : ""}">
      ${t.cardP ? `<img class="trk-cardp" src="${esc(t.cardP)}" alt="">` : ""}
      <div><div class="trk-riot">${esc(t.nome)}<span>#${esc(t.tag)}</span></div>
        <div class="tags"><span class="tag">Nível ${t.nivel ?? "?"}</span><span class="tag">${esc(REGIOES[cfg.regiao] || cfg.regiao)}</span>
        <button class="tag" data-act="trk-recarregar" data-nome="${esc(nome)}">↻ Atualizar</button></div></div>
    </div>

        ${t.rr !== null ? `<div class="trk-rr"><div style="width:${Math.max(0, Math.min(100, t.rr))}%"></div></div><small>${t.rr} RR${t.ultimo !== null ? ` · última: <b style="color:var(${t.ultimo >= 0 ? "--win" : "--loss"})">${t.ultimo >= 0 ? "+" : ""}${t.ultimo}</b>` : ""}</small>` : ""}</div></div>

    ${porAgente.length ? `<div class="card"><h2 style="margin-top:0">Por agente</h2><div class="scroll-x"><table class="trk-ag">
      <tr><th>Agente</th><th>Partidas</th><th>% Vitória</th><th>K / D / A médio</th><th>K/D</th><th>KDA</th><th>HS</th><th>ACS</th></tr>
      ${porAgente.map(a => `<tr class="clic ${trkAgente === a.nome ? "sel" : ""}" data-act="trk-ag" data-ag="${esc(trkAgente === a.nome ? "" : a.nome)}" title="Ver só ${esc(a.nome)}">
        <td><span class="agn">${a.icone ? `<img src="${esc(a.icone)}" alt="" onerror="this.remove()">` : ""}<b>${esc(a.nome)}</b></span></td>
        <td>${a.s.n}</td><td>${a.s.wr}%</td><td>${a.s.km} / ${a.s.dm} / ${a.s.am}</td>
        <td class="${+a.s.kd >= 1 ? "w" : "lo"}">${a.s.kd}</td><td>${a.s.kda}</td><td>${a.s.hs}%</td><td>${a.s.acs}</td></tr>`).join("")}
    </table></div></div>` : ""}

    ${porMapa.length ? `<div class="card" style="margin-top:12px"><h2 style="margin-top:0">Por mapa</h2><div class="scroll-x"><table class="trk-ag trk-mp">
      <tr><th>Mapa</th><th>Partidas</th><th>% Vitória</th><th>K / D / A médio</th><th>K/D</th><th>HS</th><th>ACS</th></tr>
      ${porMapa.map(a => `<tr>
        <td><span class="agn">${a.img ? `<img class="mp" src="${esc(a.img)}" alt="" onerror="this.remove()">` : ""}<b>${esc(a.nome)}</b></span></td>
        <td>${a.s.n}</td><td class="${a.s.wr >= 50 ? "w" : "lo"}">${a.s.wr}%</td><td>${a.s.km} / ${a.s.dm} / ${a.s.am}</td>

        ? (sel.length ? `<div class="trk-partidas">${sel.slice(0, 60).map(m => linhaPartida(m, `${fmtDia(m.dia).slice(0, 5)} ${m.hora || ""}`)).join("")}</div>${sel.length > 60 ? `<p class="trk-nota" style="margin-top:8px">Mostrando as 60 mais recentes de ${sel.length}.</p>` : ""}` : '<p class="empty">Nenhuma ranqueada neste período.</p>')
        : (t.lista.length ? `<div class="trk-partidas">${t.lista.map(m => linhaPartida({ ...m, icone: agenteIcone("", m.agente) || m.icone, mapaImg: mapaImg(m.mapa) }, quando(m.quando))).join("")}</div>` : '<p class="empty">Nenhuma partida competitiva recente.</p>')}
    </div>`;
}


/* ---------------------------------------------------------- Aquecimento (cronômetro por pessoa) */
/* Histórico no JSON: aquecimento -> "AAAA-MM-DD" -> { s: segundos, n: sessões }. Guarda só os últimos 30 dias. */
const AQ_DIAS = 30;
const aqChave = nome => `aquec:${nome}`;
const aqInicio = nome => { try { return +localStorage.getItem(aqChave(nome)) || 0; } catch { return 0; } };
const fmtTempo = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}`; };
const fmtDur = s => { s = Math.round(s); if (s < 60) return `${s}s`; const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h}h ${String(m).padStart(2, "0")}min` : `${m} min`; };
let aqTimer = null;
function aqTick(){
  const el = document.getElementById("aqRelogio");
  if (!el) { clearInterval(aqTimer); aqTimer = null; return; }
  const ini = +el.dataset.inicio;
  el.textContent = ini ? fmtTempo((Date.now() - ini) / 1000) : "00:00:00";
}

function renderAquecimento(nome, eu){
  const p = db.perfis[nome], hist = p.aquecimento || {}, hoje = hojeISO(), ini = eu ? aqInicio(nome) : 0;
  const dias = [...Array(AQ_DIAS)].map((_, i) => somarDias(hoje, i - AQ_DIAS + 1));
  const seg = k => +hist[k]?.s || 0, tot = ks => ks.reduce((a, k) => a + seg(k), 0);
  const ult7 = dias.slice(-7), treinados = dias.filter(k => seg(k) > 0);
  let seq = 0; for (let i = dias.length - 1; i >= 0; i--) { if (seg(dias[i]) > 0) seq++; else if (dias[i] !== hoje) break; }
  const max = Math.max(60, ...dias.map(seg));
  const W = 720, H = 180, P = { l: 8, r: 8, t: 18, b: 24 }, bw = (W - P.l - P.r) / AQ_DIAS;
  const barras = dias.map((k, i) => { const v = seg(k), h = v / max * (H - P.t - P.b), x = P.l + i * bw;
    return `<g>${v ? `<rect x="${x + 2}" y="${H - P.b - h}" width="${bw - 4}" height="${h}" rx="3" fill="var(--accent)"/>` : `<rect x="${x + 2}" y="${H - P.b - 2}" width="${bw - 4}" height="2" rx="1" fill="var(--line)"/>`}
      <title>${fmtDia(k)}: ${v ? fmtDur(v) : "sem aquecimento"}</title></g>
      ${i % 5 === 4 || k === hoje ? `<text x="${x + bw / 2}" y="${H - 6}" fill="${k === hoje ? "var(--accent)" : "var(--muted)"}" font-size="10" text-anchor="middle">${k.slice(8)}/${k.slice(5, 7)}</text>` : ""}`; }).join("");
  if (eu && ini) setTimeout(() => { if (!aqTimer) aqTimer = setInterval(aqTick, 1000); aqTick(); });
  return `
    <div class="card aq-relogio ${ini ? "rodando" : ""}">
      <div class="aq-status">${ini ? "🔥 Aquecendo agora" : eu ? "Pronto para aquecer?" : "Cronômetro de aquecimento"}</div>
      <div class="aq-tempo" id="aqRelogio" data-inicio="${ini || ""}">${ini ? fmtTempo((Date.now() - ini) / 1000) : "00:00:00"}</div>
      ${eu && !leitura ? `<div class="aq-btns">
        ${ini ? `<button class="btn aq-fim" data-act="aq-fim" data-nome="${esc(nome)}">■ Terminar e salvar</button>
                 <button class="btn ghost" data-act="aq-cancelar" data-nome="${esc(nome)}">Cancelar</button>`
              : `<button class="btn aq-ini" data-act="aq-ini" data-nome="${esc(nome)}">▶ Iniciar aquecimento</button>`}
      </div>` : !eu && !leitura && !sessao ? '<p class="aq-nota">Entre em "Quem é você?" para usar o seu cronômetro.</p>' : ""}
    </div>

    <div class="kpis">
      <div class="card kpi p"><div class="l">Hoje</div><div class="v">${fmtDur(seg(hoje))}</div><small>${+hist[hoje]?.n || 0} ${(+hist[hoje]?.n || 0) === 1 ? "sessão" : "sessões"}</small></div>
      <div class="card kpi"><div class="l">Últimos 7 dias</div><div class="v">${fmtDur(tot(ult7))}</div><small>${ult7.filter(k => seg(k)).length} de 7 dias</small></div>
      <div class="card kpi"><div class="l">Últimos 30 dias</div><div class="v">${fmtDur(tot(dias))}</div><small>${treinados.length} ${treinados.length === 1 ? "dia" : "dias"} com aquecimento</small></div>
      <div class="card kpi w"><div class="l">Sequência</div><div class="v">${seq} ${seq === 1 ? "dia" : "dias"}</div><small>média ${treinados.length ? fmtDur(tot(dias) / treinados.length) : "—"} por dia</small></div>
    </div>

    <div class="card chart"><h2 style="margin-top:0">Aquecimento · últimos 30 dias</h2>
      <svg viewBox="0 0 ${W} ${H}" font-family="Inter">${barras}</svg></div>

    <div class="card" style="margin-top:12px"><h2 style="margin-top:0">Histórico</h2><div class="scroll"><table>
      <tr><th>Dia</th><th>Sessões</th><th>Tempo</th></tr>
      ${treinados.slice().reverse().map(k => `<tr><td>${fmtDiaLongo(k)}</td><td>${+hist[k].n || 1}</td><td><b>${fmtDur(seg(k))}</b></td></tr>`).join("") || '<tr><td colspan="3" class="empty">Nenhum aquecimento nos últimos 30 dias.</td></tr>'}
    </table></div></div>
    <p class="trk-nota" style="margin-top:8px">O histórico guarda só os últimos ${AQ_DIAS} dias; o mais antigo é apagado sozinho.</p>`;
}

let diaSel = null, mesSel = null;
const linhaPartida = (m, sub) => `<div class="trk-partida ${m.resultado}"${m.mapaImg ? ` style="background-image:linear-gradient(90deg,var(--panel2) 40%,rgba(var(--fade),.5) 62%,rgba(var(--fade),.92) 88%),url('${esc(m.mapaImg)}')"` : ""}>
  <span class="res">${m.resultado === "V" ? "Vitória" : m.resultado === "D" ? "Derrota" : "Empate"}</span>

  <span class="mapa"><b>${esc(m.mapa || "?")}</b><small>${esc(m.agente || "")}${sub ? " · " + esc(sub) : ""}</small></span>
  <span class="plac">${esc(m.placar || "")}</span>
  <span class="kda"><b>${m.k}/${m.d}/${m.a}</b><small>HS ${m.hs}% · ACS ${m.acs}</small></span></div>`;

function graficoMes(d, mes, sel){
  const [y, m] = mes.split("-").map(Number), N = new Date(y, m, 0).getDate(), hoje = hojeISO();
  const W = 720, H = 230, P = { l: 28, r: 8, t: 16, b: 26 }, mid = (H - P.b + P.t) / 2;
  const ks = [...Array(N)].map((_, i) => `${mes}-${String(i + 1).padStart(2, "0")}`);
  const max = Math.max(1, ...ks.map(k => Math.max(+d[k]?.ganhou || 0, +d[k]?.perdeu || 0)));
  const bw = (W - P.l - P.r) / N, hh = mid - P.t;
  let s = `<line x1="${P.l}" x2="${W - P.r}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>
    <text x="${P.l - 6}" y="${P.t + 8}" fill="var(--muted)" font-size="10" text-anchor="end">${max}</text>
    <text x="${P.l - 6}" y="${mid * 2 - P.t}" fill="var(--muted)" font-size="10" text-anchor="end">${max}</text>`;
  ks.forEach((k, i) => {
    const g = +d[k]?.ganhou || 0, p = +d[k]?.perdeu || 0, x = P.l + i * bw, hg = g / max * hh, hp = p / max * hh, fut = k > hoje;
    s += `<g class="gdia${k === sel ? " sel" : ""}${fut ? " fut" : ""}" ${fut ? "" : `data-act="dia-sel" data-dia="${k}"`}>
      <rect class="hit" x="${x}" y="${P.t - 8}" width="${bw}" height="${H - P.b - P.t + 14}" rx="4"/>
      ${g ? `<rect x="${x + 2}" y="${mid - hg}" width="${bw - 4}" height="${hg}" rx="3" fill="var(--win)"/>` : ""}
      ${p ? `<rect x="${x + 2}" y="${mid}" width="${bw - 4}" height="${hp}" rx="3" fill="var(--loss)"/>` : ""}
      <title>${fmtDia(k)}: ganhou ${g}, perdeu ${p}</title></g>`;
    if (i === 0 || (i + 1) % 5 === 0 || k === sel) s += `<text x="${x + bw / 2}" y="${H - 6}" fill="${k === sel ? "var(--accent)" : "var(--muted)"}" font-size="10" font-weight="${k === sel ? 800 : 400}" text-anchor="middle">${i + 1}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" font-family="Inter">${s}</svg>`;
}

      </div>
      ${diaSel !== hoje ? '<div class="dia-volta"><button class="tag" data-act="dia-hoje">Voltar para hoje</button></div>' : ""}
      <div class="dia-kpis">
        <div><span>Partidas</span><b>${sd.t}</b></div>
        <div class="w"><span>Ganhou</span><b>${sd.g}</b></div>

/* ---------------------------------------------------------- Sincronização das ranqueadas (tracker -> placar.json) */
const inicioMes = () => hojeISO().slice(0, 7) + "-01";
const inicioAno = () => hojeISO().slice(0, 4) + "-01-01";
function partidaDoTracker(m){
  const st = m.stats || {}, meta = m.meta || {}, ini = new Date(meta.started_at || 0);
  if (!meta.id || isNaN(ini)) return null;
  const time = String(st.team || "").toLowerCase(), outro = time === "red" ? "blue" : "red";
  const rw = x => x && typeof x === "object" ? (+x.rounds_won || +x.won || 0) : (+x || 0);
  const a = rw(m.teams?.[time]), b = rw(m.teams?.[outro]), rounds = a + b || 1;
  const sh = st.shots || {}, tiros = (sh.head || 0) + (sh.body || 0) + (sh.leg || 0);
  return { id: String(meta.id), dia: iso(ini), hora: `${String(ini.getHours()).padStart(2, "0")}:${String(ini.getMinutes()).padStart(2, "0")}`,
    resultado: a > b ? "V" : a < b ? "D" : "E", placar: `${a}-${b}`, mapa: meta.map?.name || "", agente: st.character?.name || "", agenteId: st.character?.id || "", mapaId: meta.map?.id || "",
    k: st.kills || 0, d: st.deaths || 0, a: st.assists || 0, hs: tiros ? Math.round((sh.head || 0) / tiros * 100) : 0, acs: Math.round((st.score || 0) / rounds) };
}
/* Busca as ranqueadas do ano. Para quando chega no começo do ano ou numa página que já está toda salva. */
async function buscarRanqueadas(cfg, desde){
  const [n, t] = cfg.conta.split("#"), q = `${encodeURIComponent(n)}/${encodeURIComponent(t)}`, reg = cfg.regiao || "br";
  const ja = cfg.partidas || {}, completo = (cfg.desde || "9") <= desde, out = [];
  for (let page = 1; page <= 20; page++) {
    const lista = await henrik(`v1/stored-matches/${reg}/${q}?mode=competitive&page=${page}&size=25`);
    if (!Array.isArray(lista) || !lista.length) break;
    let antigas = false, novasNaPagina = 0;
    for (const m of lista) {
      const x = partidaDoTracker(m); if (!x) continue;
      if (x.dia < desde) { antigas = true; continue; }
      if (!ja[x.id]) novasNaPagina++;
      out.push(x);
    }
    if (antigas || lista.length < 25 || (completo && !novasNaPagina)) break;
  }
  return out;
}
const sincronizando = new Set();
async function sincronizarRanqueadas(nomePerfil){
  if (!TRACKER_ON || !backend?.salva) return 0;
  const v = db.perfis[nomePerfil]?.valorant;
  if (!v?.conta || sincronizando.has(nomePerfil)) return 0;
  sincronizando.add(nomePerfil);
  try {
    const desde = inicioAno(), ja = v.partidas || {}, novas = (await buscarRanqueadas(v, desde)).filter(m => !ja[m.id]);
    const ampliar = (v.desde || "9") > desde;
    const elo = await eloDoTracker(v), eloMudou = elo && elo !== db.perfis[nomePerfil].elo;
    if (!novas.length && v.migrado && !eloMudou && !ampliar) return 0;
    await acao({ op: "valorant_sync", nome: nomePerfil, partidas: novas.slice(0, 500), desde, ...(eloMudou ? { elo } : {}) });
    render();
    return novas.length;
  } finally { sincronizando.delete(nomePerfil); }
}
async function sincronizarTodos(){
  for (const n of Object.keys(db.perfis)) {
    try { const k = await sincronizarRanqueadas(n); if (k) toast(`${n}: +${k} ranqueadas do tracker`); }
    catch (e) { console.warn("sync", n, e.message); }
  }
}
let syncLigado = false;
function ligarSync(){
  if (syncLigado || !TRACKER_ON || !backend?.salva) return;
  syncLigado = true; sincronizarTodos(); setInterval(sincronizarTodos, 5 * 60 * 1000);
}

/* Vozes da boas-vindas. Primeiro tenta o mp3 em vozes/<voz>/<nome>.mp3 (ou geral.mp3), que funciona
   em qualquer lugar (Discord, celular). Sem mp3, usa a voz de leitura do navegador mais parecida. */
const VOZES = {
  epaminondas: { nome: "Epaminondas", desc: "masculina", pitch: 0.8, rate: 0.95, gosta: /daniel|ant[oô]nio|felipe|ricardo|fabio|male|masculin/i, evita: /maria|francisca|luciana|thalita|female|feminin/i },
  clara:       { nome: "Clara",       desc: "feminina",  pitch: 1.05, rate: 1,   gosta: /francisca|maria|luciana|thalita|vit[oó]ria|female|feminin/i, evita: /daniel|ant[oô]nio|felipe|ricardo|male|masculin/i },
};
const vozDe = nome => db.perfis[nome]?.voz === "mudo" ? "mudo" : VOZES[db.perfis[nome]?.voz] ? db.perfis[nome].voz : "epaminondas";
function vozPtBr(id){
  const vs = ("speechSynthesis" in window) ? speechSynthesis.getVoices().filter(v => /^pt/i.test(v.lang)) : [], c = VOZES[id] || VOZES.epaminondas;
  const br = vs.filter(v => /^pt[-_]BR/i.test(v.lang));
  return br.find(v => c.gosta.test(v.name)) || br.find(v => !c.evita.test(v.name)) || br[0] || vs[0];
}
let vozCtx = null, vozAudio = null;
/* Toca o mp3 com um leve efeito de assistente (filtro de rádio + eco curto) e faz a bolinha pulsar com o volume. */
async function tocarMp3(url, orb){
  const r = await fetch(url, { method: "HEAD", cache: "no-store" }).catch(() => null);
  if (!r || !r.ok) return false;
  try { vozAudio?.pause(); } catch {}
  const a = vozAudio = new Audio(url);
  let an = null;
  try {
    vozCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (vozCtx.state === "suspended") await vozCtx.resume();
    const src = vozCtx.createMediaElementSource(a);
    const hp = vozCtx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 160;
    const pk = vozCtx.createBiquadFilter(); pk.type = "peaking"; pk.frequency.value = 2600; pk.Q.value = 0.9; pk.gain.value = 4;
    const eco = vozCtx.createDelay(); eco.delayTime.value = 0.085;
    const ret = vozCtx.createGain(); ret.gain.value = 0.22;
    an = vozCtx.createAnalyser(); an.fftSize = 512;
    src.connect(hp).connect(pk).connect(an);
    pk.connect(eco).connect(ret).connect(an); ret.connect(eco);
    an.connect(vozCtx.destination);
  } catch { an = null; }
  orb?.classList.remove("tocar");
  try { await a.play(); } catch { orb?.classList.add("tocar"); return true; }
  orb?.classList.add("falando");
  if (an && orb) {
    const buf = new Uint8Array(an.fftSize);
    const loop = () => {
      if (a.paused || a.ended) { orb.style.transform = ""; orb.style.filter = ""; return; }
      an.getByteTimeDomainData(buf);
      let pico = 0; for (const v of buf) pico = Math.max(pico, Math.abs(v - 128));
      const n = Math.min(1, pico / 70);
      orb.style.transform = `scale(${1 + n * 0.22})`; orb.style.filter = `brightness(${1 + n * 0.5})`;
      requestAnimationFrame(loop);
    };
    orb.style.animation = "none"; requestAnimationFrame(loop);
  }
  a.onended = () => { orb?.classList.remove("falando"); if (orb) { orb.style.animation = ""; orb.style.transform = ""; orb.style.filter = ""; } };
  return true;
}
async function falarBoasVindas(nome, vozId){
  const orb = document.querySelector(".bv-orb"), id = vozId || (nome ? vozDe(nome) : "epaminondas");
  try { speechSynthesis.cancel(); } catch {}
  if (id === "mudo") return; // "Sem voz": mostra a tela, mas não fala
  if (await tocarMp3(`vozes/${id}/${slug(nome || "geral")}.mp3`, orb)) return;
  if (await tocarMp3(`vozes/${id}/geral.mp3`, orb)) return;
  if (!("speechSynthesis" in window)) { orb?.classList.add("tocar"); return; }
  const c = VOZES[id] || VOZES.epaminondas;
  const falar = () => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(`Seja bem-vindo${nome ? ", " + nome : ""}. O que vai ser para hoje?`);
      u.lang = "pt-BR"; u.rate = c.rate; u.pitch = c.pitch;
      const v = vozPtBr(id); if (v) u.voice = v;
      u.onstart = () => { orb?.classList.remove("tocar"); orb?.classList.add("falando"); };
      u.onend = u.onerror = () => orb?.classList.remove("falando");
      u.onboundary = () => { if (!orb) return; orb.classList.remove("pulso"); void orb.offsetWidth; orb.classList.add("pulso"); };
      speechSynthesis.speak(u);
      setTimeout(() => { if (orb && !orb.classList.contains("falando") && !speechSynthesis.speaking) orb.classList.add("tocar"); }, 1200);
    } catch {}
  };
  if (speechSynthesis.getVoices().length) falar();
  else { let feito = false; const f = () => { if (!feito) { feito = true; falar(); } }; speechSynthesis.addEventListener("voiceschanged", f, { once: true }); setTimeout(f, 700); }
}

function lerFoto(file){
  return new Promise((ok, fail) => {
    if (!file) return ok(null);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      // Skin de Minecraft (64x64 ou 64x32): usa o rosto como foto, em pixel art.
      if (img.width === 64 && (img.height === 64 || img.height === 32)) {
        const c = Object.assign(document.createElement("canvas"), { width: 160, height: 160 }), g = c.getContext("2d");
        g.imageSmoothingEnabled = false;
        g.drawImage(img, 8, 8, 8, 8, 0, 0, 160, 160);   // rosto
        g.drawImage(img, 40, 8, 8, 8, 0, 0, 160, 160);  // camada de cima (chapéu/cabelo)
        return ok(c.toDataURL("image/png"));
      }
      const M = 220, k = Math.min(1, M / Math.max(img.width, img.height));
      const c = Object.assign(document.createElement("canvas"), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      // PNG mantém a transparência; o resto vira JPG (arquivo menor).
      const png = file.type === "image/png" ? c.toDataURL("image/png") : "";
      ok(png && png.length < 120000 ? png : c.toDataURL("image/jpeg", .85));
    };
    img.onerror = () => fail(new Error("Não consegui ler essa imagem."));
    img.src = url;
  });
}

(() => {
  const side = $("side"), h = $("sideHandle");
  const solta = () => innerWidth <= 1100;
  const pos = (x, y) => {
    x = Math.max(8, Math.min(x, innerWidth - side.offsetWidth - 8));
    y = Math.max(8, Math.min(y, innerHeight - 48));
    Object.assign(side.style, { left: x + "px", top: y + "px", right: "auto", maxHeight: `calc(100vh - ${y + 16}px)` });
  };
  const salvo = store.get("sidePos"); if (salvo && !solta()) pos(salvo.x, salvo.y);
  if (store.get("sideMin")) side.classList.add("min");
  let drag = null;
  h.addEventListener("pointerdown", e => {
    if (e.target.closest("button") || solta()) return;
    const r = side.getBoundingClientRect(); drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    h.setPointerCapture(e.pointerId);
  });
  h.addEventListener("pointermove", e => drag && pos(e.clientX - drag.dx, e.clientY - drag.dy));
  h.addEventListener("pointerup", () => { if (!drag) return; drag = null; const r = side.getBoundingClientRect(); store.set("sidePos", { x: r.left, y: r.top }); });
  h.addEventListener("dblclick", () => { store.set("sidePos", null); side.removeAttribute("style"); });
  $("sideMin").addEventListener("click", () => { side.classList.toggle("min"); store.set("sideMin", side.classList.contains("min")); });
  addEventListener("resize", () => { if (solta()) side.removeAttribute("style"); else { const s = store.get("sidePos"); if (s) pos(s.x, s.y); } });
})();

/* ---------------------------------------------------------- regras (as mesmas do server.py) */
const vazioPartidas = () => Object.fromEntries(Object.keys(JOGOS).map(j => [j, {}]));
function normalizar(data){
  data = data && typeof data === "object" ? data : {};
  data.perfis ||= {}; data.jogos ||= {};
  const ids = [...new Set([...JOGOS_FABRICA, ...Object.keys(data.jogos)])];
  for (const p of Object.values(data.perfis)) {
    p.foto ??= ""; p.pin ??= "0000"; p.elo ??= ""; p.favoritos ||= []; p.partidas ||= {};
    for (const j of ids) p.partidas[j] ||= {};
  }
  return data;
}
const publico = data => ({ jogos: JSON.parse(JSON.stringify(data.jogos || {})), perfis: Object.fromEntries(Object.entries(data.perfis).map(([n, { pin, ...r }]) => [n, JSON.parse(JSON.stringify(r))])) });
function acharNome(data, nome){
  const a = String(nome || "").trim().toLowerCase(), n = Object.keys(data.perfis).find(k => k.toLowerCase() === a);
  if (!n) throw new Error("Perfil não encontrado.");
  return n;
}
function autenticar(data, o){
  const n = acharNome(data, o.nome);
  if (String(o.pin) !== String(data.perfis[n].pin)) throw new Error("PIN errado.");
  return n;
}
const slug = s => s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "perfil";

/* A foto fica dentro do placar.json, já reduzida (aparece na hora, sem depender do Pages). */
function validarFoto(f){
  if (!f) return;
  if (!/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(f)) throw new Error("Foto inválida.");
  if (f.length > 200000) throw new Error("Foto muito grande.");
}

/* Aplica uma edição no objeto do banco e devolve o nome do perfil. */
function aplicar(data, o){
  if (o.op === "login") return autenticar(data, o);
  if (o.op === "perfil_criar") {
    const nome = String(o.nome || "").trim();
    if (!nome || nome.length > 24) throw new Error("Nome precisa ter de 1 a 24 caracteres.");
    if (Object.keys(data.perfis).some(k => k.toLowerCase() === nome.toLowerCase())) throw new Error("Já existe um perfil com esse nome.");
    if (!/^\d{4}$/.test(o.pin || "")) throw new Error("PIN precisa ter 4 números.");
    if (!ELOS.includes(o.elo || "")) throw new Error("Elo inválido.");
    validarFoto(o.foto);
    data.perfis[nome] = { foto: o.foto || "", pin: o.pin, elo: o.elo || "", favoritos: [], partidas: vazioPartidas() };
    return nome;
  }
  if (o.op === "valorant_sync") { // partidas ranqueadas vindas do tracker (sem PIN: os dados vêm da API)
    const nome = acharNome(data, o.nome), p = data.perfis[nome], v = p.valorant;
    if (!v?.conta) throw new Error("Esse perfil não tem conta do Valorant.");
    if (!v.migrado) { p.partidas.valorant = {}; v.migrado = true; } // o contador do Valorant passa a vir só do tracker
    v.partidas ||= {};
    if (/^\d{4}-\d{2}-\d{2}$/.test(o.desde || "") && o.desde < (v.desde || "9")) v.desde = o.desde; // amplia o período (ex.: ano inteiro)
    const txt = (x, n) => String(x ?? "").slice(0, n), num = x => Math.max(0, Math.min(9999, Math.round(+x || 0)));
    for (const m of (o.partidas || []).slice(0, 500)) {
      if (!m || typeof m.id !== "string" || !m.id || m.id.length > 64 || v.partidas[m.id]) continue;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(m.dia) || m.dia < (v.desde || "") || !["V", "D", "E"].includes(m.resultado)) continue;
      v.partidas[m.id] = { dia: m.dia, hora: txt(m.hora, 5), resultado: m.resultado, placar: txt(m.placar, 7), mapa: txt(m.mapa, 20),
        agente: txt(m.agente, 20), agenteId: txt(m.agenteId, 40), mapaId: txt(m.mapaId, 40), k: num(m.k), d: num(m.d), a: num(m.a), hs: num(m.hs), acs: num(m.acs) };
    }
    if (o.elo && ELOS.includes(o.elo)) p.elo = o.elo; // elo direto do tracker
    return nome;
  }
  if (o.op === "jogo_criar" || o.op === "jogo_editar") { // jogos e cores (precisa estar logado)
    autenticar(data, o); data.jogos ||= {};
    const icone = String(o.icone || "🎮").trim().slice(0, 4) || "🎮";
    if (o.cor && !HEX_RE.test(o.cor)) throw new Error("Cor inválida.");
    if (o.op === "jogo_criar") {
      const nomeJ = String(o.jogoNome || "").trim();
      if (!nomeJ || nomeJ.length > 20) throw new Error("Nome do jogo: de 1 a 20 caracteres.");
      const id = slug(nomeJ);
      if (JOGOS_FABRICA.includes(id) || data.jogos[id]) throw new Error("Esse jogo já existe.");
      data.jogos[id] = { nome: nomeJ, icone, cor: o.cor || "#7c5cff" };
      for (const p of Object.values(data.perfis)) (p.partidas ||= {})[id] ||= {};
      return id;
    }
    if (!JOGOS_FABRICA.includes(o.id) && !data.jogos[o.id]) throw new Error("Jogo não encontrado.");
    data.jogos[o.id] = { ...(data.jogos[o.id] || {}), icone, ...(o.cor ? { cor: o.cor } : {}) };
    return o.id;
  }
  const nome = autenticar(data, o), p = data.perfis[nome];
  if (o.op === "perfil_editar") {
    if (o.foto) { validarFoto(o.foto); p.foto = o.foto; }
    if ("elo" in o) { if (!ELOS.includes(o.elo || "")) throw new Error("Elo inválido."); p.elo = o.elo || ""; }
    if ("valorant" in o) {
      const v = o.valorant;
      if (!v || !v.conta) delete p.valorant;
      else {
        if (!/^[^#]{3,16}#[A-Za-z0-9]{2,5}$/.test(v.conta)) throw new Error("Use o formato Nome#TAG.");
        if (!["br", "latam", "na", "eu", "ap", "kr"].includes(v.regiao)) throw new Error("Região inválida.");
        p.valorant = { ...(p.valorant || {}), conta: v.conta, regiao: v.regiao, desde: p.valorant?.desde || (hojeISO().slice(0, 4) + "-01-01") };
      }
    }
    if ("voz" in o) { if (!["epaminondas", "clara", "mudo"].includes(o.voz)) throw new Error("Voz inválida."); if (o.voz === "epaminondas") delete p.voz; else p.voz = o.voz; }
    if ("boasVindas" in o) { if (o.boasVindas) delete p.boasVindas; else p.boasVindas = false; }
    if (o.novoPin) { if (!/^\d{4}$/.test(o.novoPin)) throw new Error("PIN precisa ter 4 números."); p.pin = o.novoPin; }
    const nn = String(o.novoNome ?? nome).trim();
    if (nn !== nome) { // troca o nome (a chave) e atualiza os favoritos de todo mundo
      if (!nn || nn.length > 24) throw new Error("Nome precisa ter de 1 a 24 caracteres.");
      if (Object.keys(data.perfis).some(k => k !== nome && k.toLowerCase() === nn.toLowerCase())) throw new Error("Já existe um perfil com esse nome.");
      data.perfis = Object.fromEntries(Object.entries(data.perfis).map(([k, v]) => [k === nome ? nn : k, v]));
      for (const q of Object.values(data.perfis)) q.favoritos = (q.favoritos || []).map(f => f === nome ? nn : f);
      return nn;
    }
  } else if (o.op === "registrar") {
    if (!JOGOS_FABRICA.includes(o.jogo) && !data.jogos?.[o.jogo]) throw new Error("Jogo inválido.");
    const g = Math.trunc(+o.ganhou || 0), l = Math.trunc(+o.perdeu || 0);
    if (Math.abs(g) > 100 || Math.abs(l) > 100) throw new Error("No máximo 100 por vez.");
    if (!g && !l) throw new Error("Digite quantas ganhou e/ou perdeu.");
    const k = hojeISO(), d = p.partidas[o.jogo], v = d[k] || { ganhou: 0, perdeu: 0 };
    const nv = { ganhou: Math.max(0, (+v.ganhou || 0) + g), perdeu: Math.max(0, (+v.perdeu || 0) + l) };
    if (nv.ganhou || nv.perdeu) d[k] = nv; else delete d[k];
  } else if (o.op === "aquecimento") { // soma no dia e guarda só os últimos 30 dias
    const sgs = Math.round(+o.segundos || 0);
    if (sgs < 1 || sgs > 6 * 3600) throw new Error("Tempo de aquecimento inválido (máximo 6 horas).");
    const dia = /^\d{4}-\d{2}-\d{2}$/.test(o.dia || "") ? o.dia : hojeISO();
    const h = p.aquecimento ||= {}, v = h[dia] || { s: 0, n: 0 };
    h[dia] = { s: (+v.s || 0) + sgs, n: (+v.n || 0) + 1 };
    const limite = somarDias(hojeISO(), -(AQ_DIAS - 1));
    for (const k of Object.keys(h)) if (k < limite) delete h[k];
  } else if (o.op === "favorito") {
    const a = acharNome(data, o.alvo);
    if (a === nome) throw new Error("Não dá pra favoritar você mesmo.");
    const i = p.favoritos.indexOf(a); i < 0 ? p.favoritos.push(a) : p.favoritos.splice(i, 1);
  } else throw new Error("Operação desconhecida.");
  return nome;
}

/* 1) PC: python server.py */
function serverBackend(){
  return {
    salva: true, intervalo: 5000,
    async get(){ const r = await fetch("api", { cache: "no-store" }); if (!r.ok) throw new Error((await r.json()).erro); return r.json(); },
    async post(o){
      const r = await fetch("api", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o) });
      const j = await r.json(); if (!r.ok) throw new Error(j.erro || "Erro no servidor."); return j;
    }
  };
}

/* 2) Online: grava o placar.json direto no repositório do GitHub, com o token salvo no navegador. */
const GH = (() => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i), repo = m && location.pathname.split("/")[1];
  return { owner: m ? m[1] : "TheusAugusto19", repo: repo || "analitcs-vava", branch: "main" };
})();
const b64enc = str => { const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(s); };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));

function githubBackend(token){
  const base = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/`;
  const hdr = { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" };
  let data = null, sha = null, fila = Promise.resolve();
  const erroHttp = async (r, acao) => {
    let det = ""; try { det = (await r.json()).message || ""; } catch {}
    const msg = r.status === 401 ? "Token inválido ou expirado." :
      r.status === 403 || r.status === 404 ? `O GitHub recusou: não consegui ${acao}. Confira se o token tem Contents: Read and write no analitcs-vava.` :
      `Não consegui ${acao} no GitHub.`;
    return new Error(`${msg} [${r.status}${det ? ": " + det : ""}]`);
  };
  async function ler(){
    const r = await fetch(`${base}placar.json?ref=${GH.branch}&t=${Date.now()}`, { headers: hdr, cache: "no-store" });
    if (!r.ok) throw await erroHttp(r, "ler o placar");
    const j = await r.json(); sha = j.sha; data = normalizar(JSON.parse(b64dec(j.content)));
  }
  async function put(path, content, message, s){
    const r = await fetch(base + path, { method: "PUT", headers: { ...hdr, "Content-Type": "application/json" },
      body: JSON.stringify({ message, content, branch: GH.branch, ...(s ? { sha: s } : {}) }) });
    if (r.status === 409 || r.status === 422) { const e = new Error("conflito"); e.conflito = true; throw e; }
    if (!r.ok) throw await erroHttp(r, "salvar");
    return r.json();
  }
  async function apagarFotoAntiga(foto){
    const path = String(foto || "").split("?")[0];
    if (!/^fotos\/[\w.-]+$/.test(path)) return;
    try {
      const r = await fetch(`${base}${path}?ref=${GH.branch}`, { headers: hdr, cache: "no-store" });
      if (!r.ok) return;
      await fetch(base + path, { method: "DELETE", headers: { ...hdr, "Content-Type": "application/json" },
        body: JSON.stringify({ message: `Remove foto antiga (${path})`, sha: (await r.json()).sha, branch: GH.branch }) });
    } catch {}
  }
  const mensagem = (o, nome) => o.op === "registrar" ? `${nome}: +${o.ganhou || 0} ganhou, +${o.perdeu || 0} perdeu (${JOGOS[o.jogo]})`
    : o.op === "aquecimento" ? `${nome}: aquecimento de ${fmtDur(o.segundos)}` : o.op === "jogo_criar" ? `Novo jogo: ${o.jogoNome}` : o.op === "jogo_editar" ? `Jogo ${o.id} atualizado` : o.op === "valorant_sync" ? `${nome}: +${(o.partidas || []).length} ranqueadas do tracker` : o.op === "perfil_criar" ? `Novo perfil: ${nome}` : o.op === "favorito" ? `${nome} favoritou ${o.alvo}` : `${nome} editou o perfil`;
  return {
    salva: true, github: true, intervalo: 15000,
    async get(){ await ler(); return publico(data); },
    // Uma gravação por vez: duas ao mesmo tempo (ex.: elo + ranqueadas) não podem se sobrescrever.
    post(o){ const r = fila.then(() => gravar(o)); fila = r.catch(() => {}); return r; }
  };
  async function gravar(o){
      if (o.op === "login") { await ler(); return { nome: aplicar(data, o), ...publico(data) }; }
      for (let t = 0; t < 3; t++) {
        await ler();
        let fotoAntiga; try { fotoAntiga = data.perfis[acharNome(data, o.nome)].foto; } catch {}
        const nome = aplicar(data, o);
        try {
          const r = await put("placar.json", b64enc(JSON.stringify(data, null, 2) + "\n"), mensagem(o, nome), sha);
          sha = r.content.sha;
          if (o.foto && fotoAntiga) apagarFotoAntiga(fotoAntiga); // limpa arquivo antigo da pasta fotos/, se houver
          return { nome, ...publico(data) };
        } catch (e) { if (!e.conflito) throw e; }
      }
      throw new Error("Outra pessoa salvou ao mesmo tempo. Tente de novo.");
  }
}

/* 3) Sem token: lê o placar.json publicado e só exibe. */
function leituraBackend(data){
  const pub = publico(normalizar(data));
  return {
    salva: false,
    async get(){ return pub; },
    async post(o){
      if (o.op !== "login") throw new Error("Para editar, conecte o token do GitHub na barra lateral.");
      return { nome: acharNome(pub, o.nome), ...pub };
    }
  };
}

/* 4) Preview: sem placar.json, funciona com dados de exemplo em memória. */
function demoBackend(){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const gerar = forca => Object.fromEntries(Object.keys(JOGOS).map(j => {
    const d = {};
    for (let i = 0; i < 75; i++) {
      if (rnd() < .45) continue;
      const x = new Date(); x.setDate(x.getDate() - i);
      const g = Math.round(rnd() * 4 * forca), p = Math.round(rnd() * 3);
      if (g || p) d[iso(x)] = { ganhou: g, perdeu: p };
    }
    return [j, d];
  }));
  const perfil = (elo, forca, favoritos = []) => ({ foto: "", pin: "1234", elo, favoritos, partidas: gerar(forca) });
  const data = { perfis: {
    "Matheus": perfil("Diamante 2", 1.1, ["Lopes"]),
    "Lopes": perfil("Ascendente 1", 1.2, ["Matheus"]),
    "Exemplo 1": perfil("Ouro 3", .8),
    "Exemplo 2": perfil("Prata 1", .6),
    "Exemplo 3": perfil("", .9),
  } };
  return {
    salva: false,
    async get(){ return publico(data); },
    async post(o){ const nome = aplicar(data, o); return { nome, ...publico(data) }; }
  };
}

/* ---------------------------------------------------------- conexão com o GitHub */
function banner(html){ const b = $("banner"); b.hidden = !html; b.innerHTML = html || ""; }
function atualizarBanner(){
  if (backend.github) banner("");
  else if (leitura) banner('<b>Modo visualização</b>. Para registrar partidas e adicionar pessoas, conecte o token do GitHub em <b>"Editar online"</b>, na barra lateral.');
  else if (!backend.salva) banner("<b>Preview</b>: dados de exemplo, nada é salvo. PIN de todos: <b>1234</b>.");
}
let timer = null;
function iniciarAtualizacao(){
  clearInterval(timer);
  if (!backend.salva) return;
  timer = setInterval(async () => {
    const ativo = document.activeElement;
    if (ativo && /INPUT|SELECT|TEXTAREA/.test(ativo.tagName)) return;
    if (document.querySelector("details[open], dialog[open]")) return;
    try { const d = await backend.get(), t = JSON.stringify(d); if (t !== lastText) { lastText = t; db = d; render(); } } catch {}
  }, backend.intervalo);
}
async function conectarGitHub(token){
  const g = githubBackend(token);
  const d = await g.get();
  store.set("ghToken", token);
  backend = g; leitura = false; db = d; lastText = JSON.stringify(d);
  if (sessao && !sessao.pin) sair();
  atualizarBanner(); render(); iniciarAtualizacao(); ligarSync();
}

/* ---------------------------------------------------------- Discord Activity */
function carregarScript(src){
  return new Promise((ok, fail) => document.head.appendChild(Object.assign(document.createElement("script"), { src, onload: ok, onerror: () => fail(new Error("Não consegui carregar " + src)) })));
}
async function iniciarDiscord(){
  await carregarScript("discord-sdk.js");
  const { DiscordSDK, patchUrlMappings } = window.DiscordEmbed;
  // Dentro do Discord só passa o que estiver em URL Mappings no Developer Portal.
  patchUrlMappings([
    { prefix: "/gh", target: "api.github.com" },
    { prefix: "/raw", target: "raw.githubusercontent.com" },
    { prefix: "/elos", target: "media.valorant-api.com" },
    { prefix: "/henrik", target: "api.henrikdev.xyz" },
    { prefix: "/vapi", target: "valorant-api.com" },
  ], { patchFetch: true, patchXhr: true, patchSrcAttributes: true });
  const sdk = new DiscordSDK(DISCORD_APP_ID);
  await sdk.ready();
  document.body.classList.add("discord");
}

async function iniciar(){
  if (NO_DISCORD) { try { await iniciarDiscord(); } catch (e) { console.error(e); } }
  try {
    const r = await fetch("api", { cache: "no-store" });
    if (r.ok && (r.headers.get("content-type") || "").includes("json")) backend = serverBackend();
  } catch {}
  if (!backend && store.get("ghToken")) {
    try { const g = githubBackend(store.get("ghToken")); await g.get(); backend = g; }
    catch (e) { toast(e.message, 1); }
  }
  if (!backend) {
    try {
      const r = await fetch("placar.json", { cache: "no-store" });
      if (r.ok) { backend = leituraBackend(await r.json()); leitura = true; }
    } catch {}
  }
  if (!backend) backend = demoBackend();
  db = await backend.get(); lastText = JSON.stringify(db);
  $("addElo").innerHTML = eloPicker("addElo");
  previewFoto($("addFoto"), $("addPrev"));
  atualizarBanner(); render(); iniciarAtualizacao(); ligarSync(); carregarAssets();
  const ss = k => { try { return sessionStorage.getItem(k); } catch { return "1"; } };
  if (!sessao && !ss("login-pulado")) mostrarLogin();
  else if (!(sessao && !ss("bv-visto") && mostrarBoasVindas())) fecharBoasVindas();
}
iniciar().catch(e => { console.error(e); fecharBoasVindas(); toast("Não consegui carregar os dados. Recarregue a página.", 1); });
